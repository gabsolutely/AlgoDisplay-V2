<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="15" fill="#0f172a"/>
  <!-- Bar chart bars (algorithm visualization) -->
  <rect x="6" y="20" width="4" height="6" rx="1" fill="#60a5fa" opacity="0.85" filter="url(#glow)"/>
  <rect x="12" y="15" width="4" height="11" rx="1" fill="#60a5fa" filter="url(#glow)"/>
  <rect x="18" y="10" width="4" height="16" rx="1" fill="#60a5fa" filter="url(#glow)"/>
  <!-- Trend line overlay -->
  <polyline points="8,21 14,16 20,11 25,7" stroke="#93c5fd" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Arrow head -->
  <polygon points="25,7 22,8 24,10" fill="#93c5fd" opacity="0.9"/>
</svg>
